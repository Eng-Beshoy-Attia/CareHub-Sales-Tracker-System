<style>
:root{
  --navy:#0B2C4F; --navy-2:#14406F; --navy-ink:#0A2440;
  --sand:#E8A45F; --sand-soft:#FBEEDF; --sand-ink:#8E5517;
  --bg:#F0F3F7; --surface:#FFFFFF; --ink:#0F2236; --muted:#5E6C7C; --line:#DCE3EB;
  --med:#2A8C8C; --corp:#4A61C8; --comm:#C9782E;
  --ok:#23885A; --bad:#C8432F; --warn:#B7791F;
  --accent:var(--navy);
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --tabbar:68px;
  --font:"Montserrat","Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
html[lang="ar"] body{font-size:16.5px}
[data-ch="Medical"]{--accent:var(--med)} [data-ch="Corporate"]{--accent:var(--corp)} [data-ch="Community"]{--accent:var(--comm)}
button{font:inherit;color:inherit}
h2{font-size:1.02rem;font-weight:700;margin:26px 0 10px}
label{display:block;font-size:.86rem;font-weight:500;margin:14px 0 6px;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--sand) 55%,transparent);outline-offset:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:var(--r-sm);font-weight:700;font-size:1rem;cursor:pointer;background:var(--navy);color:#fff}
.btn.sand{background:var(--sand);color:var(--navy-ink)}
a.btn{text-decoration:none}
.btn.accent{background:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{width:auto;min-height:40px;padding:0 14px;font-size:.88rem}
.muted{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>:only-child{grid-column:1/-1}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dark{border-color:rgba(11,44,79,.15);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ LOGIN ============ */
#login,#loading{min-height:100%;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#login .lang-top{display:flex;justify-content:flex-end;padding:14px 18px 0}
.pill{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 14px;font-size:.85rem;cursor:pointer;min-height:34px}
.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 16px 28px;gap:26px}
.login-brand img{width:150px;height:auto;display:block}
.login-card{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:24px 20px 20px;width:100%;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.login-card h1{font-size:1.25rem;margin:0 0 4px;font-weight:700}
.login-card p{margin:0 0 4px;color:var(--muted);font-size:.88rem}
.field{position:relative}
.field svg{position:absolute;inset-inline-start:12px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field input{padding-inline-start:42px}
.field .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:8px}
.login-foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px;padding:0 8px;font-size:.8rem;color:rgba(255,255,255,.6);text-align:center}
.credit{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--sand);opacity:.9}
.credit b{font-weight:500}
.foot .credit{margin-top:6px;color:var(--sand-ink);opacity:.85}
@media (max-height:720px){.login-wrap{gap:16px;padding-top:4px}.login-foot{margin-top:10px}.login-brand img{width:112px}.login-card{padding:18px 18px 14px}.login-card p{display:none}}
.msg{min-height:1.4em;color:var(--bad);font-size:.88rem;margin:10px 0 0}
#loading{justify-content:center;align-items:center;gap:28px}
#loading .login-brand img{width:130px}
.loading-box{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 24px}
.loading-box .spin{width:28px;height:28px;border-width:3px;border-color:rgba(255,255,255,.22);border-top-color:var(--sand);margin-bottom:6px}
.loading-box b{font-size:1.1rem}.loading-box small{color:rgba(255,255,255,.7)}

/* ============ SHELL ============ */
#shell{min-height:100%}
.appbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px}
.appbar .mark{width:32px;height:32px;color:var(--sand);flex:none}
.appbar .titles{flex:1;min-width:0}
.appbar b{display:block;font-size:1.05rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar small{display:block;font-size:.78rem;color:rgba(255,255,255,.72)}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
html[dir="rtl"] .flip{transform:scaleX(-1)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px))}
main.no-tabs{padding-bottom:24px}

.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;align-items:flex-end;height:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 0 8px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--navy)}
.tabbar button[aria-current="page"] svg{color:var(--sand-ink)}
.tabbar .fab{position:relative;top:-16px}
.tabbar .fab span.c{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--sand);color:var(--navy-ink);box-shadow:0 6px 16px rgba(232,164,95,.45),0 0 0 5px var(--bg)}
.tabbar .fab span.c svg{width:28px;height:28px}
.tabbar .fab{color:var(--navy)}

/* ============ HOME ============ */
.hero{background:var(--navy);color:#fff;margin:-16px -16px 0;padding:6px 20px 22px;border-radius:0 0 26px 26px}
.hero .date{font-size:.82rem;color:rgba(255,255,255,.65)}
.hero p{margin:2px 0 8px;font-size:1.45rem;font-weight:700;line-height:1.25}
.rolechip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--sand);background:rgba(232,164,95,.14);border-radius:999px;padding:3px 10px}
.rolechip i{width:7px;height:7px;border-radius:50%;background:var(--sand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:rgba(255,255,255,.07);border-radius:16px;padding:12px 4px}
.stats div{text-align:center;padding:0 6px}
.stats div+div{border-inline-start:1px solid rgba(255,255,255,.12)}
.stats b{display:block;font-size:1.55rem;font-weight:700;color:#fff;line-height:1.15;font-variant-numeric:tabular-nums}
.stats div:first-child b{color:var(--sand)}
.stats span{font-size:.75rem;color:rgba(255,255,255,.7)}
.action{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:14px 16px;border-radius:var(--r-md);border:0;background:var(--sand);color:var(--navy-ink);cursor:pointer;text-align:start;box-shadow:0 8px 18px rgba(232,164,95,.3)}
.action .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--navy);color:var(--sand);flex:none}
.action .ic svg{width:22px;height:22px}
.action b{display:block;font-size:1.02rem}
.action small{font-size:.82rem;opacity:.8}
.action .go{margin-inline-start:auto;font-size:1.4rem;font-weight:300}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sechead h2{margin:0}
.sechead span{font-size:.82rem;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:44px 14px 1fr;gap:10px;position:relative;padding-bottom:12px}
.timeline li::before{content:"";position:absolute;inset-inline-start:calc(44px + 10px + 6px);top:16px;bottom:-4px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline time{font-size:.82rem;font-weight:600;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
.tl-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c);margin-top:13px;position:relative;z-index:1}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tl-card b{display:block;font-weight:600}
.st-chip{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:999px;padding:2px 9px}
.empty-card{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-md);padding:26px 18px;text-align:center;color:var(--muted)}
.empty-card svg{width:34px;height:34px;color:var(--sand);display:block;margin:0 auto 8px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.sub{font-size:.84rem;color:var(--muted)}
.empty{padding:20px 14px;color:var(--muted);text-align:center}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}

/* ============ VISIT FORM ============ */
.seg{display:flex;gap:4px;background:#E3E8EF;border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(11,44,79,.15)}
#chTabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:1rem;font-weight:700}
.step-h b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.85rem;flex:none}
.results{list-style:none;margin:10px 0 0;padding:0;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer}
.results li:last-child button{border-bottom:0}
.meta{font-size:.8rem;color:var(--muted)}
.results .dist{font-size:.8rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1.5px solid var(--accent)}
.picked strong{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);font-size:.88rem;cursor:pointer}
.chips input{width:auto;min-height:0;accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.req::after{content:" *";color:var(--bad)}
.gps{display:flex;align-items:center;gap:16px;margin:4px 0 12px}
.ring{position:relative;width:100px;height:100px;flex:none;--c:var(--muted)}
.ring svg{width:100%;height:100%}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:1.2rem;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.ring .val small{display:block;font-size:.68rem;font-weight:500;color:var(--muted)}
.ring[data-s="busy"]{--c:var(--accent)} .ring[data-s="ok"]{--c:var(--ok)} .ring[data-s="bad"]{--c:var(--bad)} .ring[data-s="warn"]{--c:var(--warn)}
.ring[data-s="busy"] .pulse{animation:pulse 1.4s ease-out infinite;transform-origin:50% 50%}
@keyframes pulse{from{transform:scale(.55);opacity:.7}to{transform:scale(1);opacity:0}}
.gps-text{font-size:.9rem}
.gps-text strong{display:block;font-size:1rem;color:var(--c,inherit)}
.save{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);margin-top:6px}
.done{text-align:center;padding:40px 6px}
.done .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;color:#fff;background:var(--ok)}
.done h1{font-size:1.4rem;margin:0}
.flags{text-align:start;background:var(--sand-soft);border:1px solid #EBC98A;border-radius:var(--r-sm);padding:10px 14px;margin:16px 0;font-size:.88rem}

.linkbtn{display:block;margin:10px auto 0;background:none;border:0;color:var(--navy);text-decoration:underline;font-weight:600;cursor:pointer;padding:6px}
.help{margin:6px 0 14px;padding-inline-start:20px;font-size:.9rem}.help li{margin:6px 0}
.sheet h4{margin:16px 0 4px;font-size:.95rem}
.gapnote{display:flex;align-items:center;gap:10px;background:var(--sand-soft);border:1px solid #EBC98A;color:var(--sand-ink);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;font-size:.88rem;font-weight:600}
.gapnote::before{content:"⏱";font-size:1.1rem}
.placebox{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r-sm);padding:12px;font-size:.92rem}
.placebox svg{width:20px;height:20px;color:var(--accent);flex:none;margin-top:2px}
.placebox b{display:block}
.placebox.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
/* ============ DASHBOARD ============ */
.filters{display:grid;gap:10px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.filters select,.filters input{min-height:44px;padding:8px 10px;font-size:.9rem}
.filters label{margin:0 0 4px;font-size:.78rem}
.dtabs{margin:14px 0 4px;position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:6px 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi span{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:1.65rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi small{font-size:.78rem;color:var(--muted)}
.kpi.hl{background:var(--navy);border-color:var(--navy)}
.kpi.hl span,.kpi.hl small{color:rgba(255,255,255,.75)} .kpi.hl b{color:var(--sand)}
.kpi.warnk b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-top:12px}
.card h3{font-size:.95rem;margin:0 0 12px;font-weight:700}
.card h3 small{font-weight:500;color:var(--muted);font-size:.8rem;margin-inline-start:6px}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end;height:140px}
.col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.col i{display:block;width:100%;background:var(--navy);border-radius:4px 4px 1px 1px;min-height:2px}
.col i.z{background:var(--line)}
.col em{font-style:normal;font-size:.68rem;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.cols-x{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;font-size:.68rem;color:var(--muted);margin-top:6px}
.cols-x span{white-space:nowrap;overflow:visible;text-align:center;direction:ltr}
.hb{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;font-size:.86rem;padding:5px 0}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:#EDF1F5;border-radius:6px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--sand);border-radius:6px}
.hb b{font-variant-numeric:tabular-nums;min-width:28px;text-align:end}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EDF1F5}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.reprow{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-top:10px;cursor:pointer}
.reprow .top{display:flex;align-items:center;gap:12px}
.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--navy)) 14%,#fff);color:var(--c,var(--navy));font-weight:700;font-size:.9rem;flex:none}
.reprow .nm{flex:1;min-width:0}
.reprow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reprow .big{font-size:1.5rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.reprow .bar{height:6px;background:#EDF1F5;border-radius:4px;margin:10px 0 8px;overflow:hidden}
.reprow .bar i{display:block;height:100%;background:var(--sand)}
.reprow .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.reprow .facts b{color:var(--ink)}
.reprow.zero .big{color:var(--bad)}
.vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer}
.vrow:last-child{border-bottom:0}
.vrow .dot{margin-top:0}
.vrow .mn{flex:1;min-width:0}
.vrow .mn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .when{text-align:end;font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.flagmark{color:var(--warn);font-weight:700}
.dash-loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:48px 0;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
.searchbox{margin-bottom:6px}

.supchip{display:inline-block;vertical-align:middle;font-size:.68rem;font-weight:700;color:var(--sand-ink);background:var(--sand-soft);border-radius:999px;padding:1px 8px;margin-inline-start:4px}
.acc-head{display:flex;align-items:center;gap:12px}
.acc-head .avatar{width:48px;height:48px;font-size:1rem;border-radius:14px}
.hist .tl-card{display:block;width:100%;text-align:start;cursor:pointer;font:inherit;color:inherit}
.note-txt{margin:6px 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:.88rem;white-space:pre-wrap}
.next{display:inline-block;margin-top:4px;font-size:.82rem;font-weight:600;color:var(--sand-ink)}
.hist time{font-size:.74rem}
/* ============ PROFILE ============ */
.profile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.profile .avatar{width:56px;height:56px;font-size:1.2rem;border-radius:16px;background:var(--navy);color:var(--sand)}
.profile b{display:block;font-size:1.1rem}
.menu{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-weight:600;text-align:start}
.menu button:last-child{border-bottom:0}
.menu .danger{color:var(--bad)}
.foot{text-align:center;margin-top:26px;color:var(--muted);font-size:.8rem}

/* ============ SHEET / TOAST ============ */
.backdrop{position:fixed;inset:0;background:rgba(10,36,64,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0;font-size:1.15rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:.9rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;color:#fff}
#toast{position:fixed;inset-inline:16px;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r-sm);font-size:.92rem;z-index:60;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.err{background:var(--bad)}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- ================= APP SHELL ================= -->
<div id="shell" hidden>
  <header class="appbar">
    <button class="iconbtn" id="btnBack" hidden><svg class="flip"><use href="#i-back"/></svg></button>
    <svg class="mark" id="barMark"><use href="#i-mark"/></svg>
    <div class="titles"><b id="barTitle"></b><small id="barSub"></small></div>
  </header>

  <main id="main">
    <!-- HOME -->
    <section class="view" id="vHome"></section>

    <!-- VISIT -->
    <section class="view" id="vVisit" hidden>
      <div class="seg" id="chTabs" hidden></div>
      <div class="step">
        <p class="step-h"><b>1</b><span id="accTitle"></span></p>
        <div class="seg">
          <button id="modeExisting" aria-pressed="true" data-i18n="modeExisting"></button>
          <button id="modeNew" aria-pressed="false" data-i18n="modeNew"></button>
        </div>
        <div id="boxExisting">
          <div class="row2">
            <div><label for="fArea" data-i18n="area"></label><select id="fArea"></select></div>
            <div><label for="fSearch" data-i18n="search"></label><input id="fSearch" type="search" data-i18n-ph="searchPh"></div>
          </div>
          <ul class="results" id="results"></ul>
          <div class="picked" id="picked" hidden>
            <div><strong id="pickedName"></strong><span class="meta" id="pickedMeta"></span></div>
            <button class="btn ghost small" id="btnUnpick" data-i18n="change"></button>
          </div>
        </div>
        <div id="boxNew" hidden>
          <label for="nName" class="req" id="nNameLbl"></label><input id="nName">
          <label for="nCat" class="req" id="nCatLbl"></label><select id="nCat"></select>
          <label data-i18n="detectedPlace"></label>
          <div class="placebox" id="placeBox"></div>
          <p class="note" data-i18n="autoArea"></p>
          <label for="nAddress" id="nAddressLbl"></label><input id="nAddress">
          <div class="row2" id="nContactRow">
            <div><label for="nContact" data-i18n="contactName"></label><input id="nContact"></div>
            <div><label for="nRole" data-i18n="contactRole"></label><input id="nRole"></div>
          </div>
          <label for="nPhone" data-i18n="phone"></label><input id="nPhone" type="tel" inputmode="tel" dir="ltr">
        </div>
      </div>
      <div class="step">
        <p class="step-h"><b>2</b><span data-i18n="step2"></span></p>
        <div id="details"></div>
      </div>
      <div class="step">
        <p class="step-h"><b>3</b><span data-i18n="step3"></span></p>
        <div class="gps">
          <div class="ring" id="ring" data-s="idle">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="pulse" cx="50" cy="50" r="46" fill="none" stroke="var(--c)" stroke-width="3"/>
              <circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="6"/>
              <circle cx="50" cy="50" r="40" fill="none" stroke="var(--c)" stroke-width="6" stroke-linecap="round" id="ringArc" stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90 50 50)"/>
            </svg>
            <div class="val" id="ringVal">—</div>
          </div>
          <div class="gps-text" id="gpsText"></div>
        </div>
        <button class="btn ghost" id="btnGps"></button>
        <button class="linkbtn" id="btnGpsHelp" hidden data-i18n="gHelp"></button>
      </div>
      <div class="save"><div class="gapnote" id="gapNote" hidden></div><button class="btn accent" id="btnSave" disabled data-i18n="save"></button></div>
    </section>

    <!-- DONE -->
    <section class="view" id="vDone" hidden>
      <div class="done">
        <div class="mark" id="doneMark" aria-hidden="true">✓</div>
        <h1 id="doneTitle"></h1>
        <p class="muted" id="doneText"></p>
        <div class="flags" id="doneFlags" hidden></div>
        <button class="btn sand" id="btnAnother" data-i18n="another"></button>
        <div style="height:10px"></div>
        <button class="btn ghost" data-go="home" data-i18n="navHome" style="--accent:var(--navy)"></button>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section class="view" id="vDash" hidden>
      <div class="filters" id="dFilters"></div>
      <div class="dtabs"><div class="seg" id="dTabs"></div></div>
      <div id="dBody"></div>
    </section>

    <!-- REP DETAIL -->
    <section class="view" id="vRep" hidden></section>

    <!-- ACCOUNT DETAIL -->
    <section class="view" id="vAcc" hidden></section>

    <!-- PROFILE -->
    <section class="view" id="vMe" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-go="home"><svg><use href="#i-home"/></svg><span data-i18n="navHome"></span></button>
    <button data-go="visit" class="fab"><span class="c"><svg><use href="#i-plus"/></svg></span><span data-i18n="navVisit"></span></button>

    <button data-go="me"><svg><use href="#i-user"/></svg><span data-i18n="navMe"></span></button>
  </nav>

/* ---------------- API ---------------- */
function translateError(j) {
  if (j.code && T.en['E_' + j.code]) {
    const p = Object.assign({}, j.params);
    if (p.dist != null) p.dist = fmtDist(p.dist);
    if (p.area) p.area = labelOfListValue(p.area);
    if (p.district) p.district = distLabel(p.district);
    return t('E_' + j.code, p);
  }
  return j.error || t('genericError');
}

async function api(action, data = {}) {
  if (!API_URL.startsWith('https://')) throw new Error(t('needUrl'));
  const body = Object.assign({ action }, state.token ? { token: state.token } : {}, data);
  let res;
  try {
    res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  } catch (e) { throw new Error(t('offline')); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error(t('genericError')); }
  if (!j.ok) {
    if (j.code === 'SESSION_EXPIRED' && state.user) { signOut('sessionEnded'); }
    throw new Error(translateError(j));
  }
  lastPing = Date.now();
  return j;
}

/* ---------------- SESSION ----------------
   Refreshing the page keeps you signed in. After SESSION_IDLE_MIN minutes
   (10 by default) without touching the app, you are signed out. */
const SESS_KEY = 'sv_sess';
const idleMs = () => (Number(state.settings && state.settings.idleMin) || 10) * 60000;
let lastActive = Date.now(), lastSaved = 0, lastPing = Date.now();

function saveSession() {
  if (!state.token || !state.user) return;
  try { sessionStorage.setItem(SESS_KEY, JSON.stringify({ token: state.token, name: state.user.name, idle: idleMs(),
    view: state.view, repName: D.repName, lastActive })); } catch (e) {}
}
function readSession() { try { return JSON.parse(sessionStorage.getItem(SESS_KEY) || 'null'); } catch (e) { return null; } }
function clearSession() { try { sessionStorage.removeItem(SESS_KEY); localStorage.removeItem('sv_session'); } catch (e) {} }

function touchSession(force) {
  lastActive = Date.now();
  // keep the server session alive while the user is really using the app
  if (state.token && lastActive - lastPing > 240000) { lastPing = lastActive; api('ping').catch(() => {}); }
  if (force || lastActive - lastSaved > 15000) { lastSaved = lastActive; saveSession(); }
}
function checkIdle() {
  if (state.user && Date.now() - lastActive > idleMs()) signOut('idleOut');
}
['pointerdown', 'keydown', 'input', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { if (state.user) touchSession(false); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkIdle(); else if (state.user) saveSession(); });
window.addEventListener('pagehide', () => { if (state.user) saveSession(); });
setInterval(checkIdle, 20000);

async function startSession(user, token, restore) {
  state.user = user; state.token = token;
  showLoading(user.name);
  const j = await api('bootstrap');
  state.user = j.user; state.lists = j.lists; state.accounts = j.accounts; state.settings = j.settings; learnNames(j.accounts);
  const mgr = isManager();
  document.querySelectorAll('#tabbar [data-go="home"], #tabbar [data-go="visit"]').forEach(b => b.hidden = mgr);
  $('tabDash').hidden = !canDash();
  $('tabDashLbl').dataset.i18n = isSelf() ? 'navMine' : 'navDash'; $('tabDashLbl').textContent = t($('tabDashLbl').dataset.i18n);
  D.data = null; state.home = null;
  screen('shell');
  renderMe();
  let view = restore && restore.view;
  if (view === 'rep' && restore.repName) D.repName = restore.repName; else if (view === 'rep') view = 'dash';
  if (view === 'done') view = 'home';
  go(view || (mgr ? 'dash' : 'home'));
  touchSession(true);
}

async function login(name, pin) {
  const btn = $('btnLogin');
  setBusy(btn, true, 'checking');
  try {
    const auth = await api('login', { name, pin });     // the PIN is only sent here
    $('loginPin').value = '';
    await startSession(auth.user, auth.token, null);
  } catch (e) {
    state.user = null; state.token = null; clearSession();
    screen('login');
    $('loginMsg').textContent = e.message;
  } finally { setBusy(btn, false); }
}

async function resumeSession(s) {
  try { await startSession({ name: s.name }, s.token, s); }
  catch (e) {
    state.user = null; state.token = null; clearSession();
    screen('login');
    $('loginMsg').textContent = e.message;
  }
}

async function reloadData() {

  try { await startSession(state.user, state.token, keep); } catch (e) { toast(e.message, true); }
}

function signOut(reasonKey) {
  const token = state.token;
  stopGPS();
  clearSession();
  if (token) api('logout', { token }).catch(() => {});
  Object.assign(state, { user:null, token:null, home:null, view:null, lastResult:null });

}

const VIEWS = { home:'vHome', visit:'vVisit', done:'vDone', dash:'vDash', rep:'vRep', acc:'vAcc', me:'vMe' };
const TAB_OF = { home:'home', visit:'visit', done:'visit', dash:'dash', rep:'dash', acc:'dash', me:'me' };

function go(view) {
  if ((view === 'dash' || view === 'rep') && !canDash()) view = 'home';
  if (isManager() && ['home', 'visit', 'done'].includes(view)) view = 'dash';
  if (state.view === 'visit' && view !== 'visit') stopGPS();
  state.view = view;
  touchSession(true);
  Object.entries(VIEWS).forEach(([k, id]) => $(id).hidden = k !== view);
  const hideTabs = view === 'visit';
  $('tabbar').hidden = hideTabs;
  $('main').classList.toggle('no-tabs', hideTabs);
  document.querySelectorAll('#tabbar [data-go]').forEach(b => { if (b.dataset.go === TAB_OF[view]) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if (view !== 'visit') { if (state.user.channel === 'ALL') delete document.body.dataset.ch; else document.body.dataset.ch = state.user.channel; }
  renderBar();
  window.scrollTo(0, 0);
  if (view === 'home') loadHome();
  if (view === 'visit') openVisit();
  if (view === 'dash') { if (!D.data && !D.loading) loadDash(); else renderDash(); }
  if (view === 'rep') renderRep();
  if (view === 'acc') renderAccount();
  if (view === 'me') renderMe();
}

function renderBar() {
  if (!state.user) return;

    acc: [A_.data?.account?.name || t('accountT'), A_.data ? placeLabel(A_.data.account.area, A_.data.account.dis) : ''],
    rep: [D.repName || '', (() => { const r = (D.data?.reps || []).find(x => x.name === D.repName); return r ? roleText(r) : ''; })()],
    me: [t('navMe'), state.user.name]

function openVisit() {
  const ch = state.user.channel;
  state.picked = null; state.lastResult = null; state.gpsErr = null; state.where = null; state.whereErr = null; geo.at = null; geo.token++;
  if (!state.home) api('myVisits').then(r => { state.home = r; setGapClock(r); updateSave(); }).catch(() => {});
  ['nName','nAddress','nContact','nRole','nPhone','fSearch'].forEach(id => $(id).value = '');

function options(items, firstKey) {

function setChannel(ch, keep=false) {
  state.channel = ch;

  document.body.dataset.ch = ch;
  if (state.user.channel === 'ALL') renderChannelTabs();

function setMode(m) {

function distTo(a) {
  if (!state.pos || a.lat == null || a.lng == null) return null;
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(a.lat - state.pos.lat), dLng = r(a.lng - state.pos.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(state.pos.lat))*Math.cos(r(a.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function renderResults() {
  const ul = $('results');
  if (state.picked) { ul.hidden = true; return; }
  ul.hidden = false;
  const area = $('fArea').value, q = norm($('fSearch').value);
  let list = state.accounts.filter(a => a.channel === state.channel && (!area || a.area === area) && (!q || norm(a.name).includes(q)));
  list = list.map(a => ({ a, d: distTo(a) }));
  list.sort((x, y) => (x.d ?? 1e12) - (y.d ?? 1e12) || x.a.name.localeCompare(y.a.name));
  if (!list.length) { ul.innerHTML = `<li class="empty">${esc(t('noResults', { title: L(CH[state.channel].title) }))}</li>`; return; }
  ul.innerHTML = list.slice(0, 60).map(({a, d}) => `<li><button data-id="${esc(a.id)}">
      <span><span>${esc(a.name)}</span><br><span class="meta">${esc(labelOfListValue(a.category))} – ${esc(placeLabel(a.area, a.district))}</span></span>
      <span class="dist" style="color:${d != null && d <= state.settings.maxDistance ? 'var(--ok)' : 'var(--muted)'}">
        ${d == null ? (a.lat == null ? esc(t('noLocation')) : '') : esc(fmtDist(d))}</span>
    </button></li>`).join('');
  ul.querySelectorAll('button').forEach(b => b.onclick = () => pick(b.dataset.id));
}

function showPicked() {
  $('picked').hidden = !state.picked;
  if (state.picked) {
    $('pickedName').textContent = state.picked.name;
    $('pickedMeta').textContent = `${labelOfListValue(state.picked.category)} – ${placeLabel(state.picked.area, state.picked.district)}`;

}

function pick(id) {
  state.picked = state.accounts.find(a => a.id === id) || null;

}

function renderDetails() {
  const fields = DETAILS[state.channel].concat(COMMON);
  $('details').innerHTML = fields.map(f => {
    const id = 'd_' + f.k, cls = f.req ? ' class="req"' : '', label = esc(L(f.l));
    if (f.t === 'select') return `<label for="${id}"${cls}>${label}</label><select id="${id}">${options(f.o.map(o => ({ v:o[0], en:o[0], ar:o[1] })), 'choose')}</select>`;
    if (f.t === 'textarea') return `<label for="${id}">${label}</label><textarea id="${id}"></textarea>`;
    if (f.t === 'chips') {
      const opts = listItems(f.list);
      return `<label${cls}>${label}</label><div class="chips" id="${id}">${opts.map(o => `<label><input type="checkbox" value="${esc(o.v)}">${esc(lang === 'ar' ? o.ar : o.en)}</label>`).join('') || `<span class="meta">${esc(t('addProducts'))}</span>`}</div>`;
    }
    const type = f.t === 'number' ? 'number" inputmode="numeric" min="0' : f.t;
    return `<label for="${id}"${cls}>${label}</label><input id="${id}" type="${type}">`;
  }).join('');
  $('details').querySelectorAll('select,input,textarea').forEach(el => el.addEventListener('change', updateSave));

function collectDetails() {
  const out = {}, missing = [];
  DETAILS[state.channel].concat(COMMON).forEach(f => {
    const el = $('d_' + f.k);
    const v = f.t === 'chips' ? [...el.querySelectorAll('input:checked')].map(i => i.value).join(', ') : el.value.trim();
    out[f.k] = v;
    if (f.req && !v) missing.push(L(f.l));
  });
  return { details: out, missing };
}

function snapshot() {
  const s = { _chips: [...document.querySelectorAll('#vVisit .chips input:checked')].map(i => i.value) };
  document.querySelectorAll('#vVisit select[id], #vVisit input[id], #vVisit textarea[id]').forEach(el => s[el.id] = el.value);
  return s;
}
function restore(s) {
  Object.keys(s).forEach(id => { if (id !== '_chips' && $(id)) $(id).value = s[id]; });
  document.querySelectorAll('#vVisit .chips input').forEach(i => i.checked = s._chips.includes(i.value));
}

/* ---------------- GPS ---------------- */
const UA = navigator.userAgent || '';
const IN_APP = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\/|Snapchat|TikTok|musical_ly|Twitter|; wv\)/i.test(UA);
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const gps = { token:0, started:0, tick:null, perm:'unknown', lastErr:'', hooked:false };

function gpsError(s, tk, xk) { state.gpsErr = { s, tk, xk }; updateGpsUI(); }

async function checkPermission() {
  try {
    if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
    const st = await navigator.permissions.query({ name: 'geolocation' });
    gps.perm = st.state;
    if (!gps.hooked) {
      gps.hooked = true;
      st.onchange = () => { gps.perm = st.state; if (st.state !== 'denied' && state.view === 'visit' && !state.pos) startGPS(); };
    }
    return st.state;
  } catch (e) { return 'unknown'; }
}

async function startGPS() {
  stopGPS(true);
  const token = ++gps.token;
  state.gpsErr = null; state.pos = null; gps.lastErr = '';
  if (!window.isSecureContext) return gpsError('bad', 'gInsecureT', 'gInsecureX');
  if (!navigator.geolocation) return gpsError('bad', 'gUnsupT', 'gUnsupX');
  gps.started = Date.now();
  state.watchId = -1;
  updateGpsUI();
  const perm = await checkPermission();
  if (token !== gps.token) return;
  if (perm === 'denied') { stopGPS(true); return gpsError('bad', 'gDeniedT', IS_IOS ? 'gDeniedIos' : 'gDeniedAndroid'); }

  const onPos = p => {
    if (token !== gps.token) return;
    const fresh = toFix(p);
    // always follow the newest reading, so walking away is detected immediately
    if (!state.pos || fresh.time >= state.pos.time) state.pos = fresh;
    if (gps.waiter) gps.waiter(fresh);
    if (fresh.accuracy <= state.settings.maxAccuracy) detectPlace();
    clearTimeout(state.gpsTimer);
    updateGpsUI(); renderResults();
  };
  const onErr = err => {
    if (token !== gps.token) return;
    gps.lastErr = 'code ' + err.code + (err.message ? ' – ' + err.message : '');
    if (state.pos || err.code === 3) return;   // keep tracking
    stopGPS(true);
    if (err.code === 1) return gpsError('bad', IN_APP ? 'gInAppT' : 'gDeniedT', IN_APP ? 'gInAppX' : (IS_IOS ? 'gDeniedIos' : 'gDeniedAndroid'));
    gpsError('bad', 'gUnavailT', IS_IOS ? 'gFailIos' : 'gFailAndroid');
  };
  try { navigator.geolocation.getCurrentPosition(onPos, () => {}, { enableHighAccuracy:false, maximumAge:0, timeout:15000 }); } catch (e) {}
  try { state.watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy:true, maximumAge:0, timeout:30000 }); }
  catch (e) { stopGPS(true); return gpsError('bad', 'gFailT', IS_IOS ? 'gFailIos' : 'gFailAndroid'); }
  gps.tick = setInterval(() => { if (state.view === 'visit') updateGpsUI(); }, 1000);
  state.gpsTimer = setTimeout(() => {
    if (token !== gps.token || state.pos) return;
    stopGPS(true);
    gpsError('bad', IN_APP ? 'gInAppT' : 'gFailT', IN_APP ? 'gInAppX' : (IS_IOS ? 'gFailIos' : 'gFailAndroid'));
  }, 45000);
}

const toFix = p => ({ lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy), time:p.timestamp || Date.now() });

/* A brand-new GPS reading taken at the moment of saving:
   whichever comes first — a one-shot reading or the next live-tracking update */
function freshFix() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('no-geo'));
    const since = Date.now() - 1500;
    let done = false;
    const finish = (ok, v) => { if (done) return; done = true; gps.waiter = null; clearTimeout(timer); ok ? resolve(v) : reject(v); };
    gps.waiter = fix => { if (fix.time >= since) finish(true, fix); };
    navigator.geolocation.getCurrentPosition(p => finish(true, toFix(p)), () => {}, { enableHighAccuracy:true, maximumAge:0, timeout:15000 });
    const timer = setTimeout(() => finish(false, new Error('timeout')), 16000);
  });
}

function stopGPS(silent) {
  if (state.watchId != null && state.watchId !== -1 && navigator.geolocation) navigator.geolocation.clearWatch(state.watchId);
  state.watchId = null; clearTimeout(state.gpsTimer); clearInterval(gps.tick);
  if (silent !== true) updateGpsUI();
}

function setGps(s, title, text, val='—', fill=0) {
  $('ring').dataset.s = s;
  $('gpsText').style.setProperty('--c', `var(--${s === 'busy' ? 'accent' : s === 'idle' ? 'muted' : s})`);
  $('gpsText').innerHTML = `<strong>${esc(title)}</strong>${esc(text)}`;
  $('ringVal').innerHTML = val;
  $('ringArc').style.strokeDashoffset = 251.3 * (1 - fill);
  $('btnGps').disabled = false;
  $('btnGps').textContent = t(state.pos ? 'locateAgain' : state.watchId != null ? 'gRestart' : 'locate');
  $('btnGpsHelp').hidden = !(s === 'bad' || s === 'warn' || (!state.pos && state.watchId != null && Date.now() - gps.started > 12000));
  updateSave();
}

const normN = s => norm(s).replace(/\s+/g, ' ');

/* ---- detected place (area / district / street come from the GPS point, never typed) ---- */
function learnNames(list) {
  (list || []).forEach(o => {
    if (o.area && o.areaAr) AR_NAMES[o.area] = o.areaAr;
    const d = o.district ?? o.dis, dAr = o.districtAr ?? o.disAr;
    if (d && dAr) AR_NAMES[d] = dAr;
  });
}
function distLabel(v) { return v ? (lang === 'ar' && AR_NAMES[v] ? AR_NAMES[v] : v) : ''; }
const placeLabel = (area, dis) => labelOfListValue(area) + (dis && dis !== area ? ' – ' + distLabel(dis) : '');
function placeText(w) {
  if (!w) return '';
  const ar = lang === 'ar';
  const parts = [ar ? w.streetAr : w.street, ar ? w.districtAr : w.district, ar ? w.areaAr : w.area, ar ? w.govAr : w.gov].filter(Boolean);
  return [...new Set(parts)].join(ar ? '، ' : ', ');
}
function accountAreas() {
  const m = new Map();
  state.accounts.filter(a => a.channel === state.channel && a.area).forEach(a => m.set(a.area, a.areaAr || AR_NAMES[a.area] || a.area));
  return [...m.entries()].map(([en, ar]) => ({ v: en, en: labelOfListValue(en) === en ? en : labelOfListValue(en), ar })).sort((a, b) => a.en.localeCompare(b.en));
}
function territoryOk(w) {
  const ua = (state.user && state.user.areas) || [];
  if (!ua.length || !w) return true;
  const names = [w.area, w.areaAr, w.district, w.districtAr, w.gov, w.govAr].filter(Boolean).map(normN);
  return ua.some(a => { const x = normN(a); return names.some(n => n === x || n.includes(x) || x.includes(n)); });
}

const geo = { busy:false, at:null, token:0 };
async function detectPlace(force) {
  const p = state.pos; if (!p || geo.busy) return;
  if (!force && geo.at && state.where && distTo(geo.at) < 80) return;
  geo.busy = true; state.whereErr = null; renderPlaceBox();
  const my = ++geo.token, at = { lat:p.lat, lng:p.lng };
  try {
    const r = await api('where', { lat: p.lat, lng: p.lng });
    if (my !== geo.token) return;
    state.where = r.where; geo.at = at; learnNames([r.where]);
  } catch (e) { state.whereErr = e.message; }
  finally { geo.busy = false; renderPlaceBox(); updateGpsUI(); }
}
function renderPlaceBox() {
  const el = $('placeBox'); if (!el) return;
  el.classList.toggle('bad', !!state.whereErr || (state.where && !territoryOk(state.where)));
  if (state.where) el.innerHTML = `<svg><use href="#i-pin"/></svg><span><b>${esc(placeText(state.where))}</b></span>`;
  else if (state.whereErr) el.innerHTML = `<svg><use href="#i-pin"/></svg><span>${esc(state.whereErr)}</span>`;
  else el.innerHTML = `<span class="spin dark"></span><span>${esc(t('gDetectT'))}</span>`;
}

function gpsCheck() {
  const r = gpsCheckBase();
  if (r.ok && state.where) r.extra = ' 📍 ' + placeText(state.where) + '.';
  return r;
}

function gpsCheckBase() {
  const p = state.pos, s = state.settings;
  if (!p) return { ok:false };
  if (p.accuracy > s.maxAccuracy) return { ok:false, s:'warn', tk:'gWeakT', xk:'gWeakX', p:{ acc:p.accuracy, max:s.maxAccuracy } };
  if (state.where && !territoryOk(state.where)) return { ok:false, s:'bad', tk:'gNotYourAreaT', xk:'gNotYourAreaX', p:{ area: placeText(state.where) } };
  if (state.mode === 'new' && !state.where) return state.whereErr
    ? { ok:false, s:'bad', tk:'gDetectFailT', xk:'gDetectFailX' }
    : { ok:false, s:'busy', tk:'gDetectT', xk:'gDetectX' };
  return gpsCheckDist();
}

function gpsCheckDist() {
  const p = state.pos, s = state.settings;
  if (state.mode === 'existing' && state.picked) {
    const d = distTo(state.picked);
    if (d == null) return { ok:true, s:'ok', tk:'gNoAccLocT', xk:'gNoAccLocX' };
    const p2 = { dist: fmtDist(d), max: s.maxDistance, name: state.picked.name };
    if (d > s.maxDistance) return { ok:!s.block, s: s.block ? 'bad' : 'warn', tk:'gFarT', xk: s.block ? 'gFarBlockX' : 'gFarWarnX', p:p2 };
    return { ok:true, s:'ok', tk:'gHereT', xk:'gHereX', p:p2 };
  }
  return { ok:true, s:'ok', tk:'gReadyT', xk: state.mode === 'new' ? 'gReadyNewX' : 'gReadyPickX' };
}

function updateGpsUI() {
  const busy = state.watchId != null;
  const secs = Math.round((Date.now() - gps.started) / 1000);
  if (!state.pos) {
    if (busy) return setGps('busy', t('gBusyT') + (secs > 2 ? ` ${secs}s` : ''), t(secs > 12 ? 'gSlowX' : 'gBusyX'));
    if (state.gpsErr) return setGps(state.gpsErr.s, t(state.gpsErr.tk), t(state.gpsErr.xk));
    return setGps('idle', t('gIdleT'), t('gIdleX'));
  }
  const acc = state.pos.accuracy;
  const fill = Math.max(.08, Math.min(1, 1 - (acc - 5) / (state.settings.maxAccuracy * 1.5)));
  const val = `±${acc}<small>${esc(t('meters'))}</small>`;
  const c = gpsCheck();
  const age = Math.round((Date.now() - state.pos.time) / 1000);
  const live = busy ? ' ' + t(age > 20 ? 'gLiveOld' : 'gLive', { s: age }) : '';
  setGps(c.s, t(c.tk, c.p), t(c.xk, c.p) + (c.extra || '') + live, val, fill);
}

function openGpsHelp() {
  const steps = k => `<ol class="help">${[1, 2, 3, 4].map(i => T.en[k + i] ? `<li>${esc(t(k + i))}</li>` : '').join('')}</ol>`;
  const yes = v => v ? t('yes') : t('no');
  $('sheet').innerHTML = `<div class="grab"></div><h3>${esc(t('helpT'))}</h3>
    ${IN_APP ? `<p class="flags">${esc(t('gInAppX'))}</p>` : ''}
    <h4>${esc(t(IS_IOS ? 'helpIosT' : 'helpAndroidT'))}</h4>${steps(IS_IOS ? 'helpI' : 'helpA')}
    <h4>${esc(t(IS_IOS ? 'helpAndroidT' : 'helpIosT'))}</h4>${steps(IS_IOS ? 'helpA' : 'helpI')}
    <dl class="dl" style="font-size:.8rem">
      <dt>${esc(t('dgSecure'))}</dt><dd>${esc(yes(window.isSecureContext))}</dd>
      <dt>${esc(t('dgPerm'))}</dt><dd>${esc(gps.perm)}</dd>
      <dt>${esc(t('dgInApp'))}</dt><dd>${esc(yes(IN_APP))}</dd>
      <dt>${esc(t('dgErr'))}</dt><dd>${esc(gps.lastErr || '—')}</dd>
    </dl>
    <button class="btn" data-close>${esc(t('close'))}</button>`;
  $('sheetWrap').hidden = false;
}

/* ---------------- SAVE ---------------- */
function canSave() {
  if (state.saving || !state.pos || gapRemaining() > 0) return false;
  if (!gpsCheck().ok) return false;
  if (state.mode === 'existing') return !!state.picked;
  return !!($('nName').value.trim() && $('nCat').value && state.where);
}
function updateSave() { renderGapNote(); $('btnSave').disabled = !canSave(); }

/* ---- minimum time between visits ---- */
function setGapClock(r) {
  if (!r) return;
  state.clockOffset = (r.serverNow || Date.now()) - Date.now();
  state.lastVisitAt = r.lastAt || null;
}
function gapRemaining() {
  const gap = Number(state.settings.gapMin) || 0;
  if (!gap || !state.lastVisitAt) return 0;
  return Math.max(0, state.lastVisitAt + gap * 60000 - (Date.now() + (state.clockOffset || 0)));
}
function nextVisitTime() {
  const at = new Date(state.lastVisitAt + state.settings.gapMin * 60000 - (state.clockOffset || 0));
  return new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', timeZone: TZ }).format(at);
}
function gapText() { const ms = gapRemaining(); return ms ? t('gapWait', { at: nextVisitTime(), min: Math.ceil(ms / 60000) }) : ''; }
function renderGapNote() {
  const el = $('gapNote'); if (!el) return;
  const txt = gapText(); el.hidden = !txt; el.textContent = txt;
}

async function save() {
  const { details, missing } = collectDetails();
  if (missing.length) { toast(t('missing', { list: missing.join(lang === 'ar' ? '، ' : ', ') }), true); return; }
  const btn = $('btnSave');
  state.saving = true; setBusy(btn, true, 'gConfirm');
  try {
    // re-check the location right now: the rep must still be at the account when saving
    let fix;
    try { fix = await freshFix(); } catch (e) { throw new Error(t('gConfirmFail')); }
    state.pos = fix; updateGpsUI(); renderResults();
    const c = gpsCheck();
    if (!c.ok) throw new Error(c.tk ? t(c.tk, c.p) + ' — ' + t(c.xk, c.p) : t('gConfirmFail'));

    setBusy(btn, true, 'saving');
    const visit = {
      channel: state.channel,
      accountId: state.mode === 'existing' ? state.picked.id : null,
      newAccount: state.mode === 'new' ? {
        name: $('nName').value.trim(), category: $('nCat').value, address: $('nAddress').value.trim(),
        contactPerson: $('nContact').value.trim(), contactRole: $('nRole').value.trim(), phone: $('nPhone').value.trim()
      } : null,
      lat: fix.lat, lng: fix.lng, accuracy: fix.accuracy,
      positionTime: fix.time, deviceTime: Date.now(), userAgent: navigator.userAgent, details
    };
    const j = await api('saveVisit', { visit });
    const i = state.accounts.findIndex(a => a.id === j.account.id);
    if (i >= 0) state.accounts[i] = j.account; else state.accounts.push(j.account);
    state.lastResult = j; state.home = null; D.data = null;
    state.lastVisitAt = Date.now() + (state.clockOffset || 0);
    renderDone();
    go('done');
  } catch (e) {
    toast(e.message, true);
  } finally { state.saving = false; setBusy(btn, false); updateSave(); }
}

function renderDone() {
  const j = state.lastResult; if (!j) return;
  const review = j.status === 'OUT_OF_RANGE';
  $('doneTitle').textContent = t(review ? 'doneReview' : 'done');
  $('doneMark').style.background = review ? 'var(--warn)' : 'var(--ok)';
  $('doneText').textContent = `${j.account.name} – ${t('S_' + j.status)}`;
  $('doneFlags').hidden = !j.flags.length;
  $('doneFlags').innerHTML = j.flags.map(f => esc(t('F_' + f.code, f.params || {}))).join('<br>');
}

/* =====================================================================

   ===================================================================== */
function periodRange() {
  const today = todayStr();
  switch (D.period) {
    case 'today': return [today, today];
    case '7': return [addDays(today, -6), today];
    case 'month': return [today.slice(0, 8) + '01', today];
    case 'custom': return [D.from || addDays(today, -29), D.to || today];
    default: return [addDays(today, -29), today];
  }
}

async function loadDash() {
  const [from, to] = periodRange();
  D.loading = true; D.err = null; renderDash();
  try { D.data = await api('dashboard', { from, to, channel: D.channel }); learnNames(D.data.visits); learnNames(D.data.accounts); }
  catch (e) { D.err = e.message; }
  D.loading = false;
  if (D.data && D.rep && !repNames().includes(D.rep)) D.rep = '';
  if (state.view === 'dash') renderDash();
  if (state.view === 'rep') renderRep();
}

const FIELD_ROLES = ['Rep', 'Supervisor'];
const supOf = name => (D.data?.reps.find(r => r.name === name) || {}).sup || '';
const inTeamFilter = name => !D.team || name === D.team || normN(supOf(name)) === normN(D.team);
function supervisors() { return D.data ? D.data.reps.filter(r => r.role === 'Supervisor').map(r => r.name).sort((a, b) => a.localeCompare(b)) : []; }
function filteredVisits() { return D.data.visits.filter(v => (!D.rep || v.rep === D.rep) && inTeamFilter(v.rep)); }

function repNames() {
  if (!D.data) return [];
  return [...new Set(D.data.reps.map(r => r.name).concat(D.data.visits.map(v => v.rep)))].sort((a, b) => a.localeCompare(b));
}

const countBy = (arr, fn) => {
  const m = new Map();
  arr.forEach(x => { const k = fn(x); if (k === '' || k == null) return; m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
};
const sum = (arr, fn) => arr.reduce((s, x) => s + (Number(fn(x)) || 0), 0);
function dateList(from, to) { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; }

/* ---- UI pieces ---- */
const kpi = (label, value, sub = '', cls = '') => `<div class="kpi ${cls}"><span>${esc(label)}</span><b>${value}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
const card = (title, inner, note = '') => `<section class="card"><h3>${esc(title)}${note ? `<small>${esc(note)}</small>` : ''}</h3>${inner}</section>`;
const emptyMsg = () => `<p class="empty">${esc(t('noData'))}</p>`;

function barsH(rows, labelFn = k => k, colorFn) {
  if (!rows.length) return emptyMsg();
  const max = Math.max(...rows.map(r => r[1]), 1);
  return rows.map(([k, v]) => `<div class="hb"><span class="hb-l" title="${esc(labelFn(k))}">${esc(labelFn(k))}</span>
    <span class="hb-t"><i style="width:${(v / max * 100).toFixed(1)}%;${colorFn ? 'background:' + colorFn(k) : ''}"></i></span><b>${fmtN(v)}</b></div>`).join('');
}

function colChart(labels, values) {
  const n = values.length, max = Math.max(1, ...values);
  const show = new Set([0, Math.floor((n - 1) / 2), n - 1]);
  return `<div class="cols" style="--n:${n}">${values.map((v, i) => `<div class="col" title="${esc(labels[i])}: ${v}">${v && n <= 14 ? `<em>${v}</em>` : ''}<i class="${v ? '' : 'z'}" style="height:${v ? Math.max(3, v / max * 100).toFixed(1) : 2}%"></i></div>`).join('')}</div>
    <div class="cols-x" style="--n:${n}">${labels.map((l, i) => `<span>${n <= 8 || show.has(i) ? esc(l) : ''}</span>`).join('')}</div>`;
}

function trendChart(V, from, to) {
  const days = dateList(from, to), byDay = {};
  V.forEach(v => byDay[v.d] = (byDay[v.d] || 0) + 1);
  if (days.length <= 45) return card(t('sDaily'), colChart(days.map(fmtDay), days.map(d => byDay[d] || 0)));
  const labels = [], vals = [];
  for (let i = 0; i < days.length; i += 7) { const wk = days.slice(i, i + 7); labels.push(fmtDay(wk[0])); vals.push(sum(wk, d => byDay[d])); }
  return card(t('sWeekly'), colChart(labels, vals));
}

function gpsStack(V) {
  const keys = ['VERIFIED', 'NEW_ACCOUNT', 'LOCATION_SET', 'OUT_OF_RANGE'], total = V.length || 1;
  const c = Object.fromEntries(keys.map(k => [k, V.filter(v => v.st === k).length]));
  return card(t('sGps'), `<div class="stack">${keys.map(k => c[k] ? `<i style="width:${c[k] / total * 100}%;background:${ST_COLOR[k]}"></i>` : '').join('')}</div>
    <div class="legend">${keys.map(k => `<span><i style="background:${ST_COLOR[k]}"></i>${esc(t('st_' + k))} <b>${fmtN(c[k])}</b></span>`).join('')}</div>`);
}

function visitRow(v, showRep = true) {
  return `<button class="vrow" data-visit="${esc(v.id)}"><span class="dot" style="background:${ST_COLOR[v.st] || 'var(--muted)'}"></span>
    <span class="mn"><b>${esc(v.an)}${v.fl ? ' <span class="flagmark">!</span>' : ''}</b><span class="sub">${showRep ? esc(v.rep) + ' – ' : ''}${esc(placeLabel(v.area, v.dis))}${v.out ? ' – ' + esc(lbl(v.out)) : ''}</span></span>
    <span class="when">${esc(fmtDay(v.d))}<br>${esc(v.t)}</span></button>`;
}
const sortRecent = V => V.slice().sort((a, b) => (b.d + b.t).localeCompare(a.d + a.t));

/* ---- Render shell ---- */

    <div class="row2">

      ${isSelf() ? '' : `<div><label for="dRep">${esc(t('rep'))}</label><select id="dRep"><option value="">${esc(t('allReps'))}</option>${repNames().filter(inTeamFilter).map(n => `<option ${D.rep === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`}

/* ---- Overview ---- */
function dashOverview(V) {
  const data = D.data, total = V.length;
  const repsActive = new Set(V.map(v => v.rep)).size;
  const repsAll = data.reps.filter(r => FIELD_ROLES.includes(r.role) && inTeamFilter(r.name)).length;
  const repDays = new Set(V.map(v => v.rep + '|' + v.d)).size;
  const flagged = V.filter(v => v.fl).length;
  let html = `<div class="kpis">
    ${kpi(t('kVisits'), fmtN(total), t('inPeriod'), 'hl')}
    ${kpi(t('kAvgDay'), repDays ? (total / repDays).toFixed(1) : '0')}
    ${D.rep || isSelf() ? kpi(t('kActiveDays'), fmtN(new Set(V.map(v => v.d)).size)) : kpi(t('kActiveReps'), fmtN(repsActive), repsAll ? t('ofN', { n: repsAll }) : '')}
    ${kpi(t('kAccVisited'), fmtN(new Set(V.map(v => v.acc)).size))}
    ${kpi(t('kNewAcc'), fmtN(V.filter(v => v.st === 'NEW_ACCOUNT').length))}
    ${kpi(t('kFlagged'), fmtN(flagged), t('ofVisits', { p: pct(flagged, total) }), flagged ? 'warnk' : '')}
  </div>`;
  if (!total) return html + card(t('sDaily'), emptyMsg());
  html += trendChart(V, data.from, data.to);
  if (data.scope.length > 1 && !isSelf()) html += card(t('sByChannel'), barsH(countBy(V, v => v.ch), chLabel, k => CH[k]?.color || 'var(--sand)'));
  html += gpsStack(V);
  html += card(t('sAreas'), barsH(countBy(V, v => v.area).slice(0, 6), labelOfListValue));
  html += card(t('sDistricts'), barsH(countBy(V, v => v.dis ? v.area + '||' + v.dis : '').slice(0, 8), k => { const [a, d] = k.split('||'); return placeLabel(a, d); }));
  html += card(t('sOutcome'), barsH(countBy(V, v => v.out).slice(0, 6), lbl));
  return html;
}

/* ---- Team ---- */
function teamStats(name, all) {
  const V = all.filter(v => v.rep === name);
  return {
    name, V, visits: V.length,
    accounts: new Set(V.map(v => v.acc)).size,
    newAcc: V.filter(v => v.st === 'NEW_ACCOUNT').length,
    flagged: V.filter(v => v.fl).length,
    days: new Set(V.map(v => v.d)).size,
    last: V.reduce((m, v) => v.d > m ? v.d : m, '')
  };
}

function dashTeam() {
  const all = D.data.visits.filter(v => inTeamFilter(v.rep));
  const names = [...new Set(D.data.reps.filter(r => FIELD_ROLES.includes(r.role) && inTeamFilter(r.name)).map(r => r.name).concat(all.map(v => v.rep)))];
  const rows = names.map(n => teamStats(n, all)).sort((a, b) => b.visits - a.visits || a.name.localeCompare(b.name));
  if (!rows.length) return card(t('sTeam'), emptyMsg());
  const max = Math.max(1, ...rows.map(r => r.visits));

  return `<p class="note">${esc(t('teamNote'))}</p>` + rows.map(r => {
    const ch = chOf(r.name);
    return `<button class="reprow ${r.visits ? '' : 'zero'}" data-rep="${esc(r.name)}">
      <div class="top"><span class="avatar" style="--c:${CH[ch]?.color || 'var(--navy)'}">${esc(initials(r.name))}</span>
        <span class="nm"><b>${esc(r.name)}${(D.data.reps.find(x => x.name === r.name) || {}).role === 'Supervisor' ? ` <span class="supchip">${esc(t('supShort'))}</span>` : ''}</b>
          <span class="sub">${esc(chLabel(ch))}${supOf(r.name) ? ' – ' + esc(t('supOf', { n: supOf(r.name) })) : ''}</span></span><span class="big">${fmtN(r.visits)}</span></div>
      <div class="bar"><i style="width:${r.visits / max * 100}%"></i></div>
      <div class="facts"><span>${esc(t('fAccounts'))} <b>${r.accounts}</b></span><span>${esc(t('fNew'))} <b>${r.newAcc}</b></span>
        <span>${esc(t('fFlagged'))} <b>${r.flagged}</b></span><span>${esc(t('fDays'))} <b>${r.days}</b></span>
        <span>${esc(t('fLast'))} <b>${r.last ? esc(fmtDay(r.last)) : esc(t('never'))}</b></span></div>
    </button>`;
  }).join('');
}

/* ---- Accounts ---- */
function dashAccounts(V) {
  const A = D.data.accounts, { from, to, today } = D.data;
  const visited = new Set(V.map(v => v.acc));
  const staleLimit = addDays(today, -30);
  const stale = A.filter(a => !a.last || a.last < staleLimit).sort((a, b) => (a.last || '').localeCompare(b.last || ''));
  let html = `<div class="kpis">
    ${kpi(t('kTotalAcc'), fmtN(A.length), '', 'hl')}
    ${kpi(t('kCoverage'), pct(visited.size, A.length), t('ofN', { n: fmtN(A.length) }))}
    ${kpi(t('kAccVisited'), fmtN(visited.size), t('inPeriod'))}
    ${kpi(t('kNewInPeriod'), fmtN(A.filter(a => a.created >= from && a.created <= to).length))}
    ${kpi(t('kStale'), fmtN(stale.length), '', stale.length ? 'warnk' : '')}
    ${kpi(t('kNoLoc'), fmtN(A.filter(a => !a.loc).length))}
  </div>`;
  const most = countBy(V, v => v.acc).slice(0, 10);
  const nameOf = id => (A.find(a => a.id === id) || V.find(v => v.acc === id) || {}).name || (V.find(v => v.acc === id) || {}).an || id;
  html += card(t(isSelf() ? 'sMyAccounts' : 'sAllAccounts'),
    `<input type="search" class="searchbox" id="aSearch" value="${esc(D.accSearch || '')}" placeholder="${esc(t('searchAccounts'))}"><div id="aList">${accountList()}</div>`);
  html += card(t('sMostVisited'), barsH(most, nameOf));
  html += card(t('sAccByArea'), barsH(countBy(A, a => a.area).slice(0, 8), labelOfListValue));
  html += card(t('sAccByCat'), barsH(countBy(A, a => a.cat).slice(0, 8), labelOfListValue));
  html += card(t('sAttention'), stale.length ? `<div>${stale.slice(0, 20).map(accRow).join('')}</div>` : emptyMsg(), stale.length > 20 ? t('showingLatest', { n: 20, total: stale.length }) : '');
  return html;
}

function accRow(a) {
  return `<button class="vrow" data-acc="${esc(a.id)}"><span class="dot" style="background:${CH[a.ch]?.color}"></span>
    <span class="mn"><b>${esc(a.name)}</b><span class="sub">${esc(labelOfListValue(a.cat))} – ${esc(placeLabel(a.area, a.dis))}</span></span>
    <span class="when">${esc(t('visitsN', { n: a.cnt }))}<br><b>${a.last ? esc(fmtDay(a.last)) : esc(t('never'))}</b></span></button>`;
}
function accountList() {
  const q = norm(D.accSearch || '');
  const list = D.data.accounts.filter(a => !q || norm(a.name + ' ' + a.area + ' ' + (a.areaAr || '') + ' ' + a.dis + ' ' + labelOfListValue(a.cat)).includes(q))
    .sort((x, y) => (y.last || '').localeCompare(x.last || '') || x.name.localeCompare(y.name));
  if (!list.length) return emptyMsg();
  return list.slice(0, 60).map(accRow).join('') + (list.length > 60 ? `<p class="note">${esc(t('showingLatest', { n: 60, total: list.length }))}</p>` : '');
}

/* ---- Visits ---- */

  html += kpi(t('kVisits'), fmtN(V.length), '', 'hl');
  if (med.length) html += kpi(t('kSamples'), fmtN(sum(med, v => v.smp)), chLabel('Medical'));
  if (corp.length) {
    const signed = corp.filter(v => v.out === 'Contract signed');
    html += kpi(t('kPipeline'), fmtN(sum(corp.filter(v => !['Rejected', 'Contract signed'].includes(v.out)), v => v.deal)), chLabel('Corporate'));
    html += kpi(t('kSigned'), fmtN(signed.length), t('kSignedVal') + ': ' + fmtN(sum(signed, v => v.deal)));
  }
  if (comm.length) {
    html += kpi(t('kAttendees'), fmtN(sum(comm, v => v.att)), chLabel('Community'));
    html += kpi(t('kLeads'), fmtN(sum(comm, v => v.lds)), chLabel('Community'));
  }
  html += '</div>';
  html += card(t('sPurpose'), barsH(countBy(V, v => v.pur), lbl));
  html += card(t('sOutcome'), barsH(countBy(V, v => v.out), lbl));
  if (med.length) {
    const prods = countBy(med.flatMap(v => v.prod ? v.prod.split(/\s*,\s*/) : []), x => x);
    html += card(t('sProducts'), barsH(prods.slice(0, 8), labelOfListValue));
  }
  // weekday (Sat → Fri)
  const order = [6, 0, 1, 2, 3, 4, 5];
  const wd = {}; V.forEach(v => { const k = new Date(v.d + 'T12:00:00Z').getUTCDay(); wd[k] = (wd[k] || 0) + 1; });
  const wdName = k => new Intl.DateTimeFormat(locale(), { weekday: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(2024, 0, 7 + k, 12)));
  html += card(t('sWeekday'), colChart(order.map(wdName), order.map(k => wd[k] || 0)));
  const hours = V.filter(v => v.h != null).map(v => v.h);
  if (hours.length) {
    const lo = Math.min(8, ...hours), hi = Math.max(20, ...hours), hs = [];
    for (let h = lo; h <= hi; h++) hs.push(h);
    html += card(t('sHour'), colChart(hs.map(h => String(h)), hs.map(h => hours.filter(x => x === h).length)));
  }
  const flagged = sortRecent(V.filter(v => v.fl));
  if (flagged.length) html += card(t('sFlagged'), `<div>${flagged.slice(0, 15).map(v => visitRow(v)).join('')}</div>`, flagged.length > 15 ? t('showingLatest', { n: 15, total: flagged.length }) : '');
  html += card(t('sLog'), `<input type="search" class="searchbox" id="dSearch" value="${esc(D.search)}" placeholder="${esc(t('searchVisits'))}"><div id="dLog">${visitLog(V)}</div>`);
  return html;
}

function visitLog(V) {
  const q = norm(D.search);
  const list = sortRecent(V.filter(v => !q || norm(v.an + ' ' + v.rep + ' ' + v.area + ' ' + labelOfListValue(v.area)).includes(q)));
  if (!list.length) return emptyMsg();
  return list.slice(0, 50).map(v => visitRow(v)).join('') + (list.length > 50 ? `<p class="note">${esc(t('showingLatest', { n: 50, total: list.length }))}</p>` : '');
}

/* ---- Rep detail ---- */
function openRep(name) { D.repName = name; go('rep'); }

function renderRep() {
  const el = $('vRep');
  if (!D.data || !D.repName) { el.innerHTML = `<div class="dash-loading"><span class="spin dark"></span>${esc(t('loadingDash'))}</div>`; return; }
  const s = teamStats(D.repName, D.data.visits), V = s.V;
  renderBar();
  let html = `<div class="kpis">
    ${kpi(t('kVisits'), fmtN(s.visits), `${fmtDay(D.data.from)} – ${fmtDay(D.data.to)}`, 'hl')}
    ${kpi(t('kAvgPerDay'), s.days ? (s.visits / s.days).toFixed(1) : '0', t('kActiveDays') + ': ' + s.days)}
    ${kpi(t('kAccVisited'), fmtN(s.accounts))}
    ${kpi(t('kNewAcc'), fmtN(s.newAcc))}
    ${kpi(t('kFlagged'), fmtN(s.flagged), t('ofVisits', { p: pct(s.flagged, s.visits) }), s.flagged ? 'warnk' : '')}
    ${kpi(t('lastVisit'), s.last ? esc(fmtDay(s.last)) : esc(t('never')))}
  </div>`;
  if (!V.length) { el.innerHTML = html + card(t('sDaily'), emptyMsg()); return; }
  html += trendChart(V, D.data.from, D.data.to);
  html += gpsStack(V);
  html += card(t('sOutcome'), barsH(countBy(V, v => v.out), lbl));
  html += card(t('sPurpose'), barsH(countBy(V, v => v.pur), lbl));
  html += card(t('sAreas'), barsH(countBy(V, v => v.area).slice(0, 6), labelOfListValue));
  html += card(t('sRepVisits'), `<div>${sortRecent(V).slice(0, 30).map(v => visitRow(v, false)).join('')}</div>`, V.length > 30 ? t('showingLatest', { n: 30, total: V.length }) : '');
  el.innerHTML = html;
}

/* ---- Visit detail sheet ---- */
function openVisitDetail(id) {
  const v = D.data?.visits.find(x => x.id === id) || A_.data?.visits.find(x => x.id === id); if (!v) return;
  const row = (k, val) => val === '' || val == null ? '' : `<dt>${esc(t(k))}</dt><dd>${val}</dd>`;
  const flags = v.fl ? esc(v.fl).split(' | ').join('<br>') : '';
  $('sheet').dataset.visit = id;
  $('sheet').innerHTML = `<div class="grab"></div>
    <h3>${esc(v.an)}</h3><p class="sub" style="margin:4px 0 0">${esc(labelOfListValue(v.cat))} – ${esc(placeLabel(v.area, v.dis))}</p>
    <dl class="dl">
      ${row('dDistrict', esc(distLabel(v.dis)))}${row('dStreet', esc(v.street))}${row('dGap', v.gap != null ? esc(t('minAfter', { n: v.gap })) : '')}
      ${row('dRep', esc(v.rep))}${row('dChannel', esc(chLabel(v.ch)))}${row('dWhen', esc(fmtDay(v.d) + ' ' + v.t))}
      ${row('dPurpose', esc(lbl(v.pur)))}${row('dOutcome', esc(lbl(v.out)))}${row('dContact', esc(v.cp))}
      ${row('dProducts', v.prod ? esc(v.prod.split(/\s*,\s*/).map(labelOfListValue).join(lang === 'ar' ? '، ' : ', ')) : '')}
      ${row('dSamples', v.smp != null ? fmtN(v.smp) : '')}${row('dAttendees', v.att != null ? fmtN(v.att) : '')}
      ${row('dLeads', v.lds != null ? fmtN(v.lds) : '')}${row('dDeal', v.deal != null ? fmtN(v.deal) : '')}
      ${row('dNotes', esc(v.notes))}${row('dNext', esc(v.na))}${row('dNextDate', v.nd ? esc(fmtDay(v.nd)) : '')}
      ${row('dGps', `<span class="badge" style="background:${ST_COLOR[v.st] || 'var(--muted)'}">${esc(t('st_' + v.st))}</span>`)}
      ${row('dDistance', v.dist != null && v.dist !== '' ? esc(fmtDist(v.dist)) : '')}${row('dAccuracy', v.accu != null ? '±' + esc(fmtDist(v.accu)) : '')}
      ${row('dFlags', flags)}
    </dl>
    ${v.lat != null ? `<a class="btn sand" href="https://maps.google.com/?q=${v.lat},${v.lng}" target="_blank" rel="noopener">${esc(t('openMap'))}</a><div style="height:10px"></div>` : ''}
    ${state.view !== 'acc' ? `<button class="btn" data-acc="${esc(v.acc)}">${esc(t('openAccount'))}</button><div style="height:10px"></div>` : ''}
    <button class="btn ghost" data-close style="--accent:var(--navy)">${esc(t('close'))}</button>`;
  $('sheetWrap').hidden = false;
}
function closeSheet() { $('sheetWrap').hidden = true; delete $('sheet').dataset.visit; }

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-period],[data-dtab],[data-rep],[data-visit],[data-acc],[data-lang],[data-lang-toggle],[data-close],#btnRefresh,#btnLogout,#dRetry');
  if (!el) { if (e.target === $('sheetWrap')) closeSheet(); return; }
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.period) { D.period = el.dataset.period; if (D.period === 'custom' && !D.from) { [D.from, D.to] = [addDays(todayStr(), -29), todayStr()]; } return loadDash(); }
  if (el.dataset.dtab) { D.tab = el.dataset.dtab; renderDash(); return; }
  if (el.dataset.rep) return openRep(el.dataset.rep);
  if (el.dataset.visit) return openVisitDetail(el.dataset.visit);
  if (el.dataset.acc) return openAccount(el.dataset.acc);
  if (el.dataset.lang) return setLang(el.dataset.lang);
  if (el.hasAttribute('data-lang-toggle')) return setLang(lang === 'ar' ? 'en' : 'ar');
  if (el.hasAttribute('data-close')) return closeSheet();
  if (el.id === 'btnRefresh') { toast(t('refreshing')); return reloadData(); }
  if (el.id === 'btnLogout') return logout();
  if (el.id === 'dRetry') return loadDash();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'dCh') { D.channel = e.target.value; D.rep = ''; loadDash(); }
  if (id === 'dRep') { D.rep = e.target.value; renderDash(); }
  if (id === 'dTeam') { D.team = e.target.value; D.rep = ''; renderDash(); }
  if (id === 'dFrom' || id === 'dTo') { if (id === 'dFrom') D.from = e.target.value; else D.to = e.target.value; if (D.from && D.to) loadDash(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'aSearch') { D.accSearch = e.target.value; $('aList').innerHTML = accountList(); return; }
  if (e.target.id === 'dSearch') { D.search = e.target.value; const V = filteredVisits(); $('dLog').innerHTML = visitLog(V); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheetWrap').hidden) closeSheet(); });

$('btnLogin').onclick = () => {
  const n = $('loginName').value.trim(), p = $('loginPin').value.trim();
  if (!n || !p) { $('loginMsg').textContent = t('pickNameAndPin'); return; }
  $('loginMsg').textContent = ''; login(n, p);
};
$('loginPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnEye').onclick = () => { const p = $('loginPin'); const show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('btnEye').dataset.i18n = show ? 'hide' : 'show'; $('btnEye').textContent = t($('btnEye').dataset.i18n); };
$('loginName').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPin').focus(); });
$('btnBack').onclick = () => go(state.view === 'acc' ? (A_.from || 'dash') : (state.view === 'rep' || isManager() ? 'dash' : 'home'));
$('btnAnother').onclick = () => go('visit');
$('modeExisting').onclick = () => setMode('existing');
$('modeNew').onclick = () => setMode('new');
$('fArea').onchange = renderResults;
$('fSearch').oninput = renderResults;
$('btnUnpick').onclick = () => { state.picked = null; showPicked(); renderResults(); updateGpsUI(); };
$('btnGps').onclick = () => startGPS();
$('btnGpsHelp').onclick = openGpsHelp;
$('btnSave').onclick = save;
['nName','nCat'].forEach(id => $(id).addEventListener('input', updateSave));


setInterval(() => { if (state.user && state.view === 'home' && state.lastVisitAt) renderHome(); }, 30000);

/* ---------------- START ---------------- */
(function init() {
  applyStatic();
  try { localStorage.removeItem('sv_session'); } catch (e) {}
  const s = readSession();
  // same tab, used in the last few minutes → stay signed in after a refresh
  if (s && s.token && s.name && Date.now() - (s.lastActive || 0) < (s.idle || 600000)) { lastActive = s.lastActive; resumeSession(s); }
  else { clearSession(); screen('login'); }
})();
</script>
</body>
